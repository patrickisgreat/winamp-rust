[workspace]
resolver = "2"
members = [
    "crates/winamp-audio",
    "crates/winamp-skin",
    "crates/winamp-playlist",
    "crates/winamp-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["bmp", "png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
lofty = "0.22"
ureq = { version = "2", default-features = false, features = ["tls"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
rfd = "0.15"
directories = "6"
walkdir = "2"
percent-encoding = "2"
urlencoding = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
